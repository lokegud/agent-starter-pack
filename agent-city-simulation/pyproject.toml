[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-city-simulation"
version = "0.1.0"
description = "Modular multi-agent simulation with real-world integration"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Agent City Team"}
]
keywords = ["ai", "agents", "simulation", "trading", "multi-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core framework
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Async
    "asyncio>=3.4.3",
    "aiohttp>=3.9.0",
    "httpx>=0.25.0",

    # Database
    "sqlalchemy>=2.0.23",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",

    # Geographic (PostGIS)
    "geoalchemy2>=0.14.2",
    "shapely>=2.0.2",

    # Cache
    "redis>=5.0.1",
    "aioredis>=2.0.1",

    # Message Queue
    "kafka-python>=2.0.2",
    "aiokafka>=0.10.0",

    # AI/ML
    "anthropic>=0.8.0",
    "openai>=1.6.0",
    "langchain>=0.1.0",
    "langchain-anthropic>=0.1.0",

    # Data processing
    "pandas>=2.1.4",
    "numpy>=1.26.2",
    "scipy>=1.11.4",

    # Financial APIs
    "alpaca-py>=0.14.0",
    "yfinance>=0.2.33",
    "polygon-api-client>=1.12.0",

    # News and data
    "newsapi-python>=0.2.7",
    "praw>=7.7.1",  # Reddit
    "tweepy>=4.14.0",  # Twitter

    # Utilities
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "click>=8.1.7",
    "rich>=13.7.0",
    "faker>=21.0.0",

    # Monitoring
    "prometheus-client>=0.19.0",
    "python-json-logger>=2.0.7",

    # HTTP
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=23.12.0",
    "isort>=5.13.2",
    "mypy>=1.7.1",
    "pylint>=3.0.3",
    "ruff>=0.1.8",
]

gcp = [
    "google-cloud-pubsub>=2.18.4",
    "google-cloud-sql>=1.0.0",
    "google-cloud-storage>=2.14.0",
    "google-cloud-logging>=3.8.0",
    "google-cloud-secret-manager>=2.17.0",
]

[project.scripts]
agent-city = "core.cli:main"

[tool.setuptools]
packages = ["core", "modules", "departments"]

[tool.setuptools.package-data]
core = ["**/*.yaml", "**/*.yml", "**/*.json"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.pytest_cache
  | __pycache__
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "R0913",  # too-many-arguments
    "R0914",  # too-many-locals
]

[tool.pylint.format]
max-line-length = 100

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --cov=core --cov=modules --cov=departments"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["core", "modules", "departments"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
