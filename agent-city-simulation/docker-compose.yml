version: '3.9'

services:
  # =============================================================================
  # FOUNDATION LAYER - Core Infrastructure
  # =============================================================================

  # PostgreSQL with PostGIS (spatial data support)
  postgres:
    image: postgis/postgis:15-3.3
    container_name: agent-city-postgres
    environment:
      POSTGRES_DB: agent_city
      POSTGRES_USER: agent_user
      POSTGRES_PASSWORD: agent_dev_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_user -d agent_city"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-city-network

  # Redis - Cache and fast data store
  redis:
    image: redis:7-alpine
    container_name: agent-city-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-city-network

  # Zookeeper - Required for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: agent-city-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-city-network

  # Kafka - Message queue for inter-service communication
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: agent-city-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - agent-city-network

  # =============================================================================
  # MONITORING & OBSERVABILITY
  # =============================================================================

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: agent-city-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/docker/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    networks:
      - agent-city-network
    profiles:
      - monitoring
      - all

  # Grafana - Metrics visualization
  grafana:
    image: grafana/grafana:10.2.2
    container_name: agent-city-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-clock-panel
    ports:
      - "3001:3000"
    volumes:
      - ./infrastructure/docker/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./infrastructure/docker/grafana/datasources:/etc/grafana/provisioning/datasources
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - agent-city-network
    profiles:
      - monitoring
      - all

  # =============================================================================
  # CORE MODULES
  # =============================================================================

  # Identity Generator Service
  identity-generator:
    build:
      context: .
      dockerfile: modules/identity_generator/Dockerfile
    container_name: agent-city-identity-generator
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SERVICE_PORT=8001
    env_file:
      - .env.local
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./modules/identity_generator:/app/modules/identity_generator
      - ./core:/app/core
    networks:
      - agent-city-network
    profiles:
      - core
      - all

  # Cartographer Service
  cartographer:
    build:
      context: .
      dockerfile: modules/cartographer/Dockerfile
    container_name: agent-city-cartographer
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SERVICE_PORT=8002
    env_file:
      - .env.local
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./modules/cartographer:/app/modules/cartographer
      - ./core:/app/core
    networks:
      - agent-city-network
    profiles:
      - core
      - all

  # Orchestrator Service
  orchestrator:
    build:
      context: .
      dockerfile: modules/orchestrator/Dockerfile
    container_name: agent-city-orchestrator
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SERVICE_PORT=8003
      - MAX_AGENTS=300
    env_file:
      - .env.local
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./modules/orchestrator:/app/modules/orchestrator
      - ./core:/app/core
    networks:
      - agent-city-network
    profiles:
      - core
      - all

  # Predictor Service
  predictor:
    build:
      context: .
      dockerfile: modules/predictor/Dockerfile
    container_name: agent-city-predictor
    environment:
      - REDIS_HOST=redis
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SERVICE_PORT=8004
    env_file:
      - .env.local
    ports:
      - "8004:8004"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./modules/predictor:/app/modules/predictor
      - ./core:/app/core
    networks:
      - agent-city-network
    profiles:
      - core
      - all

  # Ranker Service
  ranker:
    build:
      context: .
      dockerfile: modules/ranker/Dockerfile
    container_name: agent-city-ranker
    environment:
      - REDIS_HOST=redis
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SERVICE_PORT=8005
    env_file:
      - .env.local
    ports:
      - "8005:8005"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./modules/ranker:/app/modules/ranker
      - ./core:/app/core
    networks:
      - agent-city-network
    profiles:
      - core
      - all

  # Data Integration Service
  data-integration:
    build:
      context: .
      dockerfile: modules/data_integration/Dockerfile
    container_name: agent-city-data-integration
    environment:
      - REDIS_HOST=redis
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SERVICE_PORT=8006
    env_file:
      - .env.local
    ports:
      - "8006:8006"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./modules/data_integration:/app/modules/data_integration
      - ./core:/app/core
    networks:
      - agent-city-network
    profiles:
      - core
      - all

  # =============================================================================
  # DEPARTMENTS
  # =============================================================================

  # R&D Department
  rd-department:
    build:
      context: .
      dockerfile: departments/rd/Dockerfile
    container_name: agent-city-rd-department
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - ORCHESTRATOR_URL=http://orchestrator:8003
      - SERVICE_PORT=8101
    env_file:
      - .env.local
    ports:
      - "8101:8101"
    depends_on:
      - orchestrator
    volumes:
      - ./departments/rd:/app/departments/rd
      - ./core:/app/core
    networks:
      - agent-city-network
    profiles:
      - rd
      - all

  # Builders Department
  builders-department:
    build:
      context: .
      dockerfile: departments/builders/Dockerfile
    container_name: agent-city-builders-department
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - ORCHESTRATOR_URL=http://orchestrator:8003
      - SERVICE_PORT=8102
    env_file:
      - .env.local
    ports:
      - "8102:8102"
    depends_on:
      - orchestrator
      - rd-department
    volumes:
      - ./departments/builders:/app/departments/builders
      - ./core:/app/core
    networks:
      - agent-city-network
    profiles:
      - builders
      - all

  # Stockbrokers Department
  stockbrokers-department:
    build:
      context: .
      dockerfile: departments/stockbrokers/Dockerfile
    container_name: agent-city-stockbrokers-department
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - ORCHESTRATOR_URL=http://orchestrator:8003
      - SERVICE_PORT=8103
      - TRADING_MODE=paper  # IMPORTANT: paper or live
    env_file:
      - .env.local
    ports:
      - "8103:8103"
    depends_on:
      - orchestrator
      - data-integration
    volumes:
      - ./departments/stockbrokers:/app/departments/stockbrokers
      - ./core:/app/core
    networks:
      - agent-city-network
    profiles:
      - stockbrokers
      - all

  # =============================================================================
  # API GATEWAY & DASHBOARD
  # =============================================================================

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: core/api_gateway/Dockerfile
    container_name: agent-city-api-gateway
    environment:
      - SERVICE_PORT=8000
    env_file:
      - .env.local
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./core/api_gateway:/app/core/api_gateway
      - ./core/shared:/app/core/shared
    networks:
      - agent-city-network
    profiles:
      - gateway
      - all

  # Dashboard (placeholder for now)
  dashboard:
    image: nginx:alpine
    container_name: agent-city-dashboard
    ports:
      - "3000:80"
    volumes:
      - ./dashboard/frontend/dist:/usr/share/nginx/html:ro
      - ./infrastructure/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - agent-city-network
    profiles:
      - dashboard
      - all

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  agent-city-network:
    driver: bridge
    name: agent-city-network

# =============================================================================
# VOLUMES (Data Persistence)
# =============================================================================
volumes:
  postgres_data:
    name: agent-city-postgres-data
  redis_data:
    name: agent-city-redis-data
  zookeeper_data:
    name: agent-city-zookeeper-data
  zookeeper_logs:
    name: agent-city-zookeeper-logs
  kafka_data:
    name: agent-city-kafka-data
  prometheus_data:
    name: agent-city-prometheus-data
  grafana_data:
    name: agent-city-grafana-data
